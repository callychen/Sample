<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise BOM Management Matrix</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h2>Enterprise BOM Management Matrix</h2>
    <p class="subtitle">Select a product and view real-time components with dynamic supplier side-drawers</p>
    
    <div class="dashboard-controls">
        <div class="control-group">
            <label for="product-select"><strong>Select Target Product:</strong></label>
            <select id="product-select">
                <option value="">-- Loading Products... --</option>
            </select>
        </div>
        <div class="control-group">
            <label for="effectivity-date"><strong>Target Effectivity Date:</strong></label>
            <input type="date" id="effectivity-date">
        </div>
    </div>

    <div class="workspace-layout">
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Part ID</th>
                        <th>Part Name</th>
                        <th>Type</th>
                        <th>Qty Required</th>
                        <th>Current Stock</th>
                        <th>Procurement Action</th>
                    </tr>
                </thead>
                <tbody id="bom-table-body">
                    <tr><td colspan="6" class="loading">Configure filters above to construct build requirements.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="supplier-sidebar" id="supplier-drawer">
            <div class="sidebar-header">
                <div>
                    <h3 style="margin:0; font-size: 18px;" id="sidebar-part-name">Part Suppliers</h3>
                    <span style="font-size: 12px; color: #666;" id="sidebar-part-id">ID: --</span>
                </div>
                <button class="sidebar-close-btn" onclick="closeSidebar()">&times;</button>
            </div>
            <div id="sidebar-content">
                </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
